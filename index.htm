<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turan Travel - Алтай тауы</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f9f3e6; text-align: center; color: #333; }
        header { background-color: #5d4037; color: white; padding: 30px; border-bottom: 5px solid #ff9900; }
        .container { padding: 40px 20px; }
        h1 { margin: 0; font-size: 2.5em; letter-spacing: 2px; }
        h2 { color: #8d6e63; margin-top: 0; }
        p { font-size: 1.3em; line-height: 1.6; max-width: 800px; margin: 20px auto; }
        .info-box { background-color: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 30px; }
        .button { display: inline-block; padding: 15px 35px; background-color: #ff9900; color: white; text-decoration: none; border-radius: 50px; font-weight: bold; transition: 0.3s; }
        .button:hover { background-color: #e68a00; transform: scale(1.05); }
    </style>
</head>
<body>
    <header>
        <h1>TURAN TRAVEL</h1>
    </header>

    <div class="container">
        <div class="info-box">
            <h2>Ата-бабалар ізімен: Алтай тауы</h2>
            <p>Моңғолиялық қазақтардың салт-дәстүрі мен ата-бабаларымыздан қалған киелі мекенге саяхат жасаңыз.</p>
            <p>Көне жазбалар мен Алтай тауының жұмбаққа толы тарихын бізбен бірге ашыңыз.</p>
        </div>
        
        <a href="#" class="button">Көне жазбаларды зерттеу</a>
    </div>
</body>
</html>
